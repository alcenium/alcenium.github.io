<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI</title>
<link rel="stylesheet" href="style.css" />

</head>
<body>
<header>Chat</header>
<div class="chat-container" id="chatContainer">
    <!-- chỗ chứa tin nhắn -->
</div>
<form class="input-area" id="chatForm">
  <input type="text" id="userInput" autocomplete="off" placeholder="Nhập tin nhắn..." />
  <button type="submit" id="sendBtn" disabled>Gửi</button>
</form>
<script>
  const chatContainer = document.getElementById('chatContainer');
  const chatForm = document.getElementById('chatForm');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  // mở tắt cái nút send nếu ko có gì trong ô input
  userInput.addEventListener('input', () => {
    sendBtn.disabled = userInput.value.trim().length === 0;
  });

  // cho tin nhắn vào chat va cuộn được
  function appendMessage(text, sender) {
    const messageDiv = document.createElement('div');
    messageDiv.classList.add('message', sender);
    messageDiv.textContent = text;
    chatContainer.appendChild(messageDiv);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  // phần này là hàm giả lập phản hồi để khi nào cài API vào sau
  function botResponse(userMsg) {
    const responses = [
      "a",
      "b",
      "c",
      "d",
      "e",
      "f"
    ];
    // Chọn tạm thời một phản hồi ngẫu nhiên ở trên
    return responses[Math.floor(Math.random() * responses.length)];
  }

  chatForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = userInput.value.trim();
    if (!text) return;

    appendMessage(text, 'user');
    userInput.value = '';
    sendBtn.disabled = true;

    // Cái này nó delay phản hồi của bot
    setTimeout(() => {
      const response = botResponse(text);
      appendMessage(response, 'bot');
    }, 800);
  });
</script>
</body>
</html>
